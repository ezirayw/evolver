  phase_2: null

# eVOLVER server parameter configurations
broadcast_timing: 10
num_sleeves: 16
port: 8081
ip: "192.168.1.15"
log_level: "DEBUG"

# RPi file locations and names
calibrations_directory: "/home/pi/calibrations"
valid_calibrations: ["temp", "od", "ipp"]
od_calibration_directory: od
temp_calibration_directory: temp

# Serial communication
serial_end_outgoing: "_!"
serial_end_incoming: end
serial_port: "/dev/ttyS0"
serial_baudrate: 9600
serial_timeout: 2
